[package]
name = "aether"
version = "0.2.1"
edition = "2021"
description = "Cross-platform Git auto-sync engine"
rust-version = "1.88"

[dependencies]
notify = "8"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Blocking HTTP only: no async runtime leaks into the CLI or the sync engine.
# `native-tls` maps to SChannel on Windows / OpenSSL elsewhere; it avoids the
# extra C build step that rustls' default backend would need on windows-gnu.
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "native-tls",
] }
urlencoding = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
